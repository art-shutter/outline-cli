name: 'Release'
permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'
'on':
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.releaserc.json'
      - 'justfile'
      - 'LICENSE'
      - 'README.md'
      - 'renovate-config.json'
      - 'renovate.json'
concurrency:
  group: 'release'
defaults:
  run:
    shell: 'bash'
jobs:
  semantic_release:
    name: 'Semantic Release'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Setup Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          node-version: lts/*
      - name: 'Release'
        env:
          GH_TOKEN: '${{ secrets.SEMANTIC_RELEASE_TOKEN }}'
        run: |
            npx semantic-release
